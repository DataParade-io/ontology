id: https://w3id.org/dataparade/ontology/core
name: dataparade_core
title: DataParade ontology — core
description: Shared identifiable types, provenance mixin, and structural slots.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  dp: https://w3id.org/dataparade/ontology/
default_prefix: dp
default_range: string
imports:
  - linkml:types
  - ../taxonomy/data_category
  - ../taxonomy/purpose
  - ../taxonomy/actor_kind
  - ../taxonomy/external_system_category

classes:
  NamedThing:
    abstract: true
    description: Identifiable node in the architecture or privacy graph.
    slots:
      - id
      - name
      - description

  Evidenced:
    mixin: true
    abstract: true
    description: >-
      Optional citation of supporting evidence. Code-derived graph facts cite
      Discovery (scanner output). Security-event facts may cite Finding (OCSF-ish).
      The two are not synonyms — do not collapse Discovery into Finding.
    slots:
      - evidenced_by
      - finding_refs

  Association:
    abstract: true
    mixins:
      - Evidenced
    description: Reified edge. Use when the relationship carries attributes or provenance.
    slots:
      - source
      - target

  Discovery:
    is_a: NamedThing
    description: >-
      Scanner output / code evidence surfaced by the DataParade scanner
      (components, data flows, locations, subject keys). Usually off-canvas on
      C4 diagrams. Distinct from Finding (security events).
    slots:
      - location

  Finding:
    is_a: NamedThing
    description: >-
      Security-event record, OCSF-shaped or OCSF-compatible (GuardDuty, Security
      Lake, etc.). Distinct from Discovery (scanner code evidence). Do not use
      Finding as a synonym for scanner output.
    slots:
      - location
      - ocsf_class_uid
      - ocsf_category

slots:
  id:
    identifier: true
    range: uriorcurie
    required: true
  name:
    range: string
  description:
    range: string
  location:
    range: string
    description: Optional file, span, resource, or event locator.
  evidenced_by:
    range: Discovery
    multivalued: true
    description: >-
      Scanner Discoveries that support this node or edge (primary provenance
      for code-derived C4/privacy facts).
  finding_refs:
    range: Finding
    multivalued: true
    description: >-
      Security-event Findings (OCSF-ish) that support this node or edge.
      Not a substitute for evidenced_by / Discovery.
  ocsf_class_uid:
    range: string
    description: Optional OCSF class_uid or equivalent class identifier.
  ocsf_category:
    range: string
    description: Optional OCSF category name or uid.
  source:
    range: NamedThing
    required: true
    description: Origin of a reified association.
  target:
    range: NamedThing
    required: true
    description: Destination of a reified association.
  contains:
    range: NamedThing
    multivalued: true
    description: Structural nesting (specialize range per class).
  interacts_with:
    range: NamedThing
    multivalued: true
    description: Architecture dependency. Not data flow; arrow direction matches the label.
  uses:
    range: NamedThing
    multivalued: true
    description: Use/dependency edge distinct from data movement.
