name: Validate LinkML

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LinkML
        run: pip install "linkml>=1.8"
      - name: Validate schema, taxonomies, and catalog
        run: |
          linkml validate schema/ontology.yaml
          linkml validate schema/catalog.yaml
          linkml validate taxonomy/*.yaml
          linkml validate -s schema/catalog.yaml -C PublicAliasCatalog catalog/external_systems.yaml
      - name: Generate JSON Schema
        run: |
          mkdir -p generated
          gen-json-schema schema/ontology.yaml > generated/ontology.schema.json
          test -s generated/ontology.schema.json
          test -s generated/ocsf-discovery.schema.json
          python -c "import json; json.load(open('generated/ocsf-discovery.schema.json'))"
          python -c "import json; json.load(open('ocsf/extension/dataparade_discovery.json'))"
          echo "Generated JSON Schema OK"
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated/
