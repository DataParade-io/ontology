name: Validate LinkML

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LinkML
        run: pip install "linkml>=1.8"
      - name: Validate and generate JSON Schema
        run: |
          mkdir -p generated
          linkml-validate --help >/dev/null 2>&1 || true
          # Load/convert schema (fails on invalid YAML/metamodel issues)
          gen-json-schema schema/ontology.yaml > generated/ontology.schema.json
          test -s generated/ontology.schema.json
          echo "Generated JSON Schema OK"
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated/
